<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Admin Renascer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Arquivo CSS Externo -->
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="/img/logo_branca.png ">
    
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <!-- Card de Login Centralizado -->
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden border border-gray-100">
        
        <!-- Cabeçalho -->
        <div class="bg-gray-900 p-8 text-center relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500 rounded-full mix-blend-overlay opacity-20 -mr-10 -mt-10"></div>
            <h1 class="text-3xl font-bold tracking-tighter text-white relative z-10">ADMIN <span class="text-blue-500">RENASCER</span></h1>
            <p class="text-gray-400 text-sm mt-2 relative z-10">Acesso restrito à liderança</p>
        </div>

        <!-- Formulário -->
        <div class="p-8">
            <form id="form-login" class="space-y-6">
                <!-- Mensagem de Erro (Oculta por padrão) -->
                <div id="mensagem-erro" class="hidden bg-red-50 text-red-600 p-3 rounded-lg text-sm text-center border border-red-200 font-medium">
                    E-mail ou senha incorretos.
                </div>

                <div>
                    <label class="block font-bold text-sm text-gray-700 mb-1">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div>
                    <label class="block font-bold text-sm text-gray-700 mb-1">Senha</label>
                    <input type="password" id="senha" placeholder="••••••••" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-blue-700 transition shadow-lg flex justify-center items-center gap-2">
                    <span>Entrar no Painel</span>
                    <!-- Ícone de Login -->
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                </button>
            </form>

            <div class="mt-8 text-center">
                <a href="/index.html" class="text-sm text-gray-500 hover:text-blue-600 font-medium transition">← Voltar para o Site Público</a>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE AUTENTICAÇÃO FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        // Importando os módulos de Autenticação
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCUTo0W0k31yBd8ORGKMzqJqv2ltLCwdEk",
            authDomain: "site-renascer-eef39.firebaseapp.com",
            projectId: "site-renascer-eef39",
            storageBucket: "site-renascer-eef39.firebasestorage.app",
            messagingSenderId: "1043023040737",
            appId: "1:1043023040737:web:a6b4192f0e99c0487d67a0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const formLogin = document.getElementById('form-login');
        const mensagemErro = document.getElementById('mensagem-erro');
        const btnSubmit = formLogin.querySelector('button');

        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Oculta erro de tentativas anteriores
            mensagemErro.classList.add('hidden'); 
            
            // Altera visual do botão
            const textoOriginal = btnSubmit.innerHTML;
            btnSubmit.innerHTML = 'Verificando...';
            btnSubmit.disabled = true;

            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            try {
                // Comando do Firebase que verifica se o e-mail e a senha existem
                await signInWithEmailAndPassword(auth, email, senha);
                
                // Se passou da linha acima, o login está correto! Redireciona para o Dashboard.
                window.location.href = "/login/admin-dashboard.html";
            } catch (error) {
                console.error("Erro no login:", error);
                // Se a senha estiver errada ou usuário não existir, mostra erro
                mensagemErro.classList.remove('hidden');
                
                // Restaura o botão
                btnSubmit.innerHTML = textoOriginal;
                btnSubmit.disabled = false;
            }
        });
    </script>
</body>
</html>
