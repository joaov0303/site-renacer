<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Admin Renascer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Arquivo CSS Externo -->
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="/img/logo_branca.png ">
    
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <!-- Card de Login Centralizado -->
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden border border-gray-100">
        
        <!-- Cabeçalho -->
        <div class="bg-gray-900 p-8 text-center relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500 rounded-full mix-blend-overlay opacity-20 -mr-10 -mt-10"></div>
            <h1 class="text-3xl font-bold tracking-tighter text-white relative z-10">ADMIN <span class="text-blue-500">RENASCER</span></h1>
            <p class="text-gray-400 text-sm mt-2 relative z-10">Acesso restrito à liderança</p>
        </div>

        <!-- Formulário -->
        <div class="p-8">
            <form id="form-login" class="space-y-6">
                <!-- Mensagem de Erro (Oculta por padrão) -->
                <div id="mensagem-erro" class="hidden bg-red-50 text-red-600 p-3 rounded-lg text-sm text-center border border-red-200 font-medium">
                    E-mail ou senha incorretos.
                </div>

                <div>
                    <label class="block font-bold text-sm text-gray-700 mb-1">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div>
                    <label class="block font-bold text-sm text-gray-700 mb-1">Senha</label>
                    <input type="password" id="senha" placeholder="••••••••" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-blue-700 transition shadow-lg flex justify-center items-center gap-2">
                    <span>Entrar no Painel</span>
                    <!-- Ícone de Login -->
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                </button>
            </form>

            <div class="mt-8 text-center">
                <a href="/index.html" class="text-sm text-gray-500 hover:text-blue-600 font-medium transition">← Voltar para o Site Público</a>
            </div>
        </div>
    </div>

    <!-- Modal de Troca de Senha (Primeiro Login) -->
    <div id="modal-primeira-senha" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8">
            <div class="text-center mb-6">
                <div class="text-5xl mb-3">🔐</div>
                <h2 class="text-2xl font-bold text-gray-900">Bem-vindo!</h2>
                <p class="text-gray-600 mt-2 text-sm">Você está acessando o painel pela primeira vez. Por favor, cadastre uma nova senha.</p>
            </div>

            <form id="form-nova-senha" class="space-y-4">
                <div>
                    <label class="block font-bold text-sm text-gray-700 mb-2">Nova Senha *</label>
                    <input type="password" id="nova-senha" placeholder="••••••••" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    <p class="text-xs text-gray-500 mt-1">Mínimo 6 caracteres</p>
                </div>

                <div>
                    <label class="block font-bold text-sm text-gray-700 mb-2">Confirmar Senha *</label>
                    <input type="password" id="confirmar-senha" placeholder="••••••••" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition shadow-lg">
                    ✅ Confirmar Nova Senha
                </button>
            </form>
        </div>
    </div>

    <!-- Modal Genérico de Notificação -->
    <div id="modal-notificacao" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8">
            <div class="text-center mb-6">
                <div id="notificacao-icone" class="text-5xl mb-3">ℹ️</div>
                <h2 id="notificacao-titulo" class="text-2xl font-bold text-gray-900">Notificação</h2>
                <p id="notificacao-mensagem" class="text-gray-600 mt-2 text-sm">Mensagem</p>
            </div>

            <div id="notificacao-botoes" class="flex gap-3">
                <button id="notificacao-btn-ok" class="flex-1 px-4 py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition">
                    ✅ OK
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE AUTENTICAÇÃO FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp, query, where, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCUTo0W0k31yBd8ORGKMzqJqv2ltLCwdEk",
            authDomain: "site-renascer-eef39.firebaseapp.com",
            projectId: "site-renascer-eef39",
            storageBucket: "site-renascer-eef39.firebasestorage.app",
            messagingSenderId: "1043023040737",
            appId: "1:1043023040737:web:a6b4192f0e99c0487d67a0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Função para registrar acessos no Firestore
        async function registrarAcesso(tipo, dados = {}) {
            try {
                await addDoc(collection(db, "login_logs"), {
                    tipo: tipo, // "acesso_pagina" ou "tentativa_login"
                    email: dados.email || null,
                    sucesso: dados.sucesso || null,
                    erroMensagem: dados.erro || null,
                    userAgent: navigator.userAgent,
                    url: window.location.href,
                    timestamp: serverTimestamp(),
                    idioma: navigator.language
                });
            } catch (error) {
                console.error("Erro ao registrar acesso:", error);
            }
        }

        // Registra quando a página de login é acessada
        registrarAcesso("acesso_pagina");

        const formLogin = document.getElementById('form-login');
        const mensagemErro = document.getElementById('mensagem-erro');
        const btnSubmit = formLogin.querySelector('button');
        let emailAtual = '';

        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Oculta erro de tentativas anteriores
            mensagemErro.classList.add('hidden'); 
            
            // Altera visual do botão
            const textoOriginal = btnSubmit.innerHTML;
            btnSubmit.innerHTML = 'Verificando...';
            btnSubmit.disabled = true;

            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            emailAtual = email;

            try {
                // Verifica credenciais do usuário no Firestore
                const q = query(collection(db, "usuarios_autorizados"), where("email", "==", email));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    throw new Error("Usuário não encontrado");
                }

                const usuarioDoc = querySnapshot.docs[0];
                const usuarioData = usuarioDoc.data();
                
                // Verifica senha (comparar com hash)
                const senhaHash = btoa(senha); // Base64 encoding
                if (usuarioData.senha !== senhaHash) {
                    throw new Error("Senha incorreta");
                }

                // Registra tentativa de login bem-sucedida
                await registrarAcesso("tentativa_login", {
                    email: email,
                    sucesso: true
                });
                
                // Verifica se é o primeiro login
                if (usuarioData.primeiroLogin === true) {
                    // Mostra modal para trocar senha
                    document.getElementById('modal-primeira-senha').classList.remove('hidden');
                    
                    // Armazena ID do documento para atualizar depois
                    sessionStorage.setItem('usuarioDocId', usuarioDoc.id);
                    sessionStorage.setItem('emailUsuario', email);
                } else {
                    // Se não é primeiro login, redireciona para o dashboard
                    window.location.href = "/login/admin-dashboard.html";
                }
            } catch (error) {
                console.error("Erro no login:", error);
                
                // Registra tentativa de login falhada
                await registrarAcesso("tentativa_login", {
                    email: email,
                    sucesso: false,
                    erro: error.message
                });
                
                // Se a senha estiver errada ou usuário não existir, mostra erro
                mensagemErro.classList.remove('hidden');
                
                // Restaura o botão
                btnSubmit.innerHTML = textoOriginal;
                btnSubmit.disabled = false;
            }
        });

        // Função auxiliar para mostrar notificações
        function mostrarNotificacao(titulo, mensagem, icone = 'ℹ️', callback = null) {
            document.getElementById('notificacao-titulo').textContent = titulo;
            document.getElementById('notificacao-mensagem').textContent = mensagem;
            document.getElementById('notificacao-icone').textContent = icone;
            
            const modal = document.getElementById('modal-notificacao');
            const btnOk = document.getElementById('notificacao-btn-ok');
            
            const handleClick = () => {
                modal.classList.add('hidden');
                btnOk.removeEventListener('click', handleClick);
                if (callback) callback();
            };
            
            btnOk.addEventListener('click', handleClick);
            modal.classList.remove('hidden');
        }

        // Formulário de nova senha
        document.getElementById('form-nova-senha').addEventListener('submit', async (e) => {
            e.preventDefault();

            const novaSenha = document.getElementById('nova-senha').value;
            const confirmarSenha = document.getElementById('confirmar-senha').value;

            if (novaSenha.length < 6) {
                mostrarNotificacao('⚠️ Validação', 'A senha deve ter no mínimo 6 caracteres.', '⚠️');
                return;
            }

            if (novaSenha !== confirmarSenha) {
                mostrarNotificacao('⚠️ Validação', 'As senhas não conferem!', '⚠️');
                return;
            }

            try {
                const usuarioDocId = sessionStorage.getItem('usuarioDocId');
                const senhaHash = btoa(novaSenha);

                // Atualiza a senha e marca que não é mais primeiro login
                await updateDoc(doc(db, "usuarios_autorizados", usuarioDocId), {
                    senha: senhaHash,
                    primeiroLogin: false,
                    dataPrimeiroLogin: serverTimestamp()
                });

                mostrarNotificacao('✅ Sucesso', 'Senha atualizada com sucesso!', '✅', () => {
                    // Limpa o modal
                    document.getElementById('modal-primeira-senha').classList.add('hidden');
                    document.getElementById('form-nova-senha').reset();
                    
                    // Redireciona para o dashboard
                    window.location.href = "/login/admin-dashboard.html";
                });
            } catch (error) {
                console.error('Erro:', error);
                mostrarNotificacao('❌ Erro', 'Erro ao atualizar a senha. Tente novamente.', '❌');
            }
        });
    </script>
</body>
</html>
