<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs de Acesso - Admin Renascer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

    <div id="app-container" class="min-h-screen flex items-center justify-center">
        <p class="text-gray-500">Verificando permissões...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCUTo0W0k31yBd8ORGKMzqJqv2ltLCwdEk",
            authDomain: "site-renascer-eef39.firebaseapp.com",
            projectId: "site-renascer-eef39",
            storageBucket: "site-renascer-eef39.firebasestorage.app",
            messagingSenderId: "1043023040737",
            appId: "1:1043023040737:web:a6b4192f0e99c0487d67a0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- FUNÇÃO DE VALIDAÇÃO DE PERMISSÃO ---
        async function verificarPermissao(email, permissaoNecessaria) {
            try {
                const userRef = doc(db, "usuarios", email);
                const userSnap = await getDoc(userRef);
                if (userSnap.exists()) {
                    const data = userSnap.data();
                    // Verifica se o array 'permissoes' contém o que precisamos
                    return Array.isArray(data.permissoes) && data.permissoes.includes(permissaoNecessaria);
                }
                return false;
            } catch (e) {
                return false;
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "/login/index.html";
                return;
            }

            // Verifica se o usuário tem a permissão 'ver_logs'
            const temAcesso = await verificarPermissao(user.email, 'ver_logs');

            if (!temAcesso) {
                document.getElementById('app-container').innerHTML = `
                    <div class="text-center p-8 bg-white rounded shadow">
                        <h1 class="text-xl font-bold text-red-600">Acesso Negado</h1>
                        <p>Você não possui a permissão necessária para ver os logs.</p>
                    </div>`;
                return;
            }

            // Se chegou aqui, renderiza a página completa
            renderizarPagina();
        });

        function renderizarPagina() {
            document.getElementById('app-container').innerHTML = `
                <div class="w-full max-w-7xl p-8">
                    <h1 class="text-2xl font-bold mb-4">Logs de Acesso</h1>
                    <button id="btn-sair" class="bg-red-500 text-white px-4 py-2 rounded">Sair</button>
                </div>
            `;
            
            document.getElementById('btn-sair').addEventListener('click', () => signOut(auth));
            carregarLogs();
        }

        async function carregarLogs() {
            // Lógica para buscar logs no Firestore...
            console.log("Logs carregados com sucesso.");
        }
    </script>
</body>
</html>
