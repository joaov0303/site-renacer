<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs de Acesso - Admin Renascer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/x-icon" href="/img/logo_branca.png">
</head>
<body class="bg-gray-50">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-6">
                    <h1 class="text-xl font-bold text-gray-900">📊 Logs de Acesso - Login</h1>
                    <div class="hidden md:flex gap-4 text-sm font-medium">
                        <a href="/login/admin-dashboard.html" class="text-gray-600 hover:text-gray-900 transition">← Dashboard</a>
                        <a href="/login/admin-usuarios.html" id="link-usuarios-logs" class="hidden text-gray-600 hover:text-gray-900 transition">👥 Usuários</a>
                    </div>
                </div>
                <button id="btn-logout" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition text-sm font-medium">
                    Sair
                </button>
            </div>
        </div>
    </nav>

    <!-- Container Principal -->
    <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
        
        <!-- Filtros -->
        <div class="bg-white rounded-lg shadow-sm p-6 mb-6 border border-gray-200">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Tipo de Log</label>
                    <select id="filtro-tipo" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="">Todos</option>
                        <option value="acesso_pagina">Acesso à Página</option>
                        <option value="tentativa_login">Tentativas de Login</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Status</label>
                    <select id="filtro-status" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="">Todos</option>
                        <option value="sucesso">Sucesso</option>
                        <option value="falha">Falha</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <input type="email" id="filtro-email" placeholder="Filtrar por email..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
            </div>
            <div class="mt-4 flex gap-2">
                <button id="btn-filtrar" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium text-sm">
                    Filtrar
                </button>
                <button id="btn-limpar" class="px-6 py-2 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400 transition font-medium text-sm">
                    Limpar Filtros
                </button>
            </div>
        </div>

        <!-- Estatísticas -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white rounded-lg shadow-sm p-6 border border-gray-200">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm font-medium">Total de Acessos</p>
                        <p id="stats-total" class="text-3xl font-bold text-gray-900 mt-1">-</p>
                    </div>
                    <span class="text-3xl">📈</span>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow-sm p-6 border border-gray-200">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm font-medium">Logins Bem-sucedidos</p>
                        <p id="stats-sucesso" class="text-3xl font-bold text-green-600 mt-1">-</p>
                    </div>
                    <span class="text-3xl">✅</span>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow-sm p-6 border border-gray-200">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm font-medium">Logins Falhados</p>
                        <p id="stats-falha" class="text-3xl font-bold text-red-600 mt-1">-</p>
                    </div>
                    <span class="text-3xl">❌</span>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow-sm p-6 border border-gray-200">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm font-medium">Hoje</p>
                        <p id="stats-hoje" class="text-3xl font-bold text-blue-600 mt-1">-</p>
                    </div>
                    <span class="text-3xl">📅</span>
                </div>
            </div>
        </div>

        <!-- Tabela de Logs -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50 border-b border-gray-200">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase tracking-wider">Data/Hora</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase tracking-wider">Tipo</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase tracking-wider">Email</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase tracking-wider">User Agent</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase tracking-wider">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="logs-tbody" class="divide-y divide-gray-200">
                        <tr>
                            <td colspan="6" class="px-6 py-4 text-center text-gray-500">Carregando logs...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Paginação -->
            <div class="bg-gray-50 px-6 py-4 border-t border-gray-200 flex items-center justify-between">
                <p id="info-paginacao" class="text-sm text-gray-600">Carregando...</p>
                <div class="flex gap-2">
                    <button id="btn-anterior" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition text-sm font-medium disabled:opacity-50" disabled>
                        ← Anterior
                    </button>
                    <button id="btn-proxima" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition text-sm font-medium disabled:opacity-50" disabled>
                        Próxima →
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Detalhes -->
    <div id="modal-detalhes" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full p-6">
            <h2 class="text-xl font-bold text-gray-900 mb-4">Detalhes do Log</h2>
            <div id="modal-conteudo" class="space-y-3 max-h-96 overflow-y-auto">
                <!-- Preenchido dinamicamente -->
            </div>
            <button onclick="document.getElementById('modal-detalhes').classList.add('hidden')" class="mt-6 w-full px-4 py-2 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400 transition font-medium">
                Fechar
            </button>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, collection, query, orderBy, limit, getDocs, where, startAfter } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCUTo0W0k31yBd8ORGKMzqJqv2ltLCwdEk",
            authDomain: "site-renascer-eef39.firebaseapp.com",
            projectId: "site-renascer-eef39",
            storageBucket: "site-renascer-eef39.firebasestorage.app",
            messagingSenderId: "1043023040737",
            appId: "1:1043023040737:web:a6b4192f0e99c0487d67a0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Verificar autenticação e autorização
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "/login/index.html";
            } else if (user.email !== 'dev.renascer@gmail.com') {
                // Usuário não autorizado
                document.body.innerHTML = `
                    <div class="min-h-screen bg-gradient-to-br from-red-50 to-red-100 flex items-center justify-center p-4">
                        <div class="bg-white rounded-lg shadow-xl p-8 max-w-md text-center">
                            <div class="text-6xl mb-4">🔒</div>
                            <h1 class="text-2xl font-bold text-gray-900 mb-2">Acesso Negado</h1>
                            <p class="text-gray-600 mb-6">Desculpe, apenas administradores autorizados podem acessar esta página.</p>
                            <p class="text-sm text-gray-500 mb-6">Seu email: <span class="font-semibold text-gray-700">${user.email}</span></p>
                            <a href="/login/admin-dashboard.html" class="inline-block px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium">
                                Voltar ao Dashboard
                            </a>
                        </div>
                    </div>
                `;
                return;
            }

            // Mostrar link de usuários se for um dos 3 emails autorizados
            const emailsAutorizadosUsuarios = ['kayrom@admin.renacer.com', 'joaov0303@hotmail.com', 'dev.renascer@gmail.com'];
            if (emailsAutorizadosUsuarios.includes(user.email)) {
                const linkUsuarios = document.getElementById('link-usuarios-logs');
                if (linkUsuarios) linkUsuarios.classList.remove('hidden');
            }
        });

        // Logout
        document.getElementById('btn-logout').addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = "/login/index.html";
        });

        let paginaAtual = 0;
        const itensPorPagina = 10;
        let ultimoDocumento = null;

        async function carregarLogs(novaPagina = 0) {
            try {
                let q = query(
                    collection(db, "login_logs"),
                    orderBy("timestamp", "desc"),
                    limit(itensPorPagina + 1)
                );

                let docs = await getDocs(q);
                let logs = docs.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                if (logs.length > itensPorPagina) {
                    logs = logs.slice(0, itensPorPagina);
                }

                exibirLogs(logs);
                atualizarEstatisticas(logs);
                atualizarBotoesPaginacao(docs.docs.length > itensPorPagina);
            } catch (error) {
                console.error("Erro ao carregar logs:", error);
                document.getElementById('logs-tbody').innerHTML = '<tr><td colspan="6" class="px-6 py-4 text-center text-red-600">Erro ao carregar logs</td></tr>';
            }
        }

        function exibirLogs(logs) {
            const tbody = document.getElementById('logs-tbody');
            
            if (logs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-4 text-center text-gray-500">Nenhum log encontrado</td></tr>';
                return;
            }

            tbody.innerHTML = logs.map(log => `
                <tr class="hover:bg-gray-50 transition">
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                        ${log.timestamp ? new Date(log.timestamp.toDate()).toLocaleString('pt-BR') : '-'}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full ${
                            log.tipo === 'acesso_pagina' 
                                ? 'bg-blue-100 text-blue-800' 
                                : 'bg-purple-100 text-purple-800'
                        }">
                            ${log.tipo === 'acesso_pagina' ? '📄 Página' : '🔑 Login'}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-900">${log.email || '-'}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full ${
                            log.sucesso === true
                                ? 'bg-green-100 text-green-800'
                                : log.sucesso === false
                                    ? 'bg-red-100 text-red-800'
                                    : 'bg-gray-100 text-gray-800'
                        }">
                            ${log.sucesso === true ? '✅ Sucesso' : log.sucesso === false ? '❌ Falha' : '⭕ N/A'}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-xs text-gray-600 max-w-xs truncate">${log.userAgent || '-'}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">
                        <button onclick="exibirDetalhes('${JSON.stringify(log).replace(/'/g, "\\'")}', event)" class="text-blue-600 hover:text-blue-800 font-medium">
                            Ver mais
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function atualizarEstatisticas(logs) {
            document.getElementById('stats-total').textContent = logs.length;
            
            const sucessos = logs.filter(l => l.sucesso === true).length;
            document.getElementById('stats-sucesso').textContent = sucessos;
            
            const falhas = logs.filter(l => l.sucesso === false).length;
            document.getElementById('stats-falha').textContent = falhas;
            
            const hoje = logs.filter(l => {
                if (!l.timestamp) return false;
                const logDate = new Date(l.timestamp.toDate()).toDateString();
                return logDate === new Date().toDateString();
            }).length;
            document.getElementById('stats-hoje').textContent = hoje;
        }

        function atualizarBotoesPaginacao(temProxima) {
            document.getElementById('btn-anterior').disabled = paginaAtual === 0;
            document.getElementById('btn-proxima').disabled = !temProxima;
            document.getElementById('info-paginacao').textContent = `Página ${paginaAtual + 1}`;
        }

        // Filtros
        document.getElementById('btn-filtrar').addEventListener('click', () => {
            console.log("Filtrar clicado");
        });

        document.getElementById('btn-limpar').addEventListener('click', () => {
            document.getElementById('filtro-tipo').value = '';
            document.getElementById('filtro-status').value = '';
            document.getElementById('filtro-email').value = '';
            carregarLogs();
        });

        document.getElementById('btn-anterior').addEventListener('click', () => {
            if (paginaAtual > 0) {
                paginaAtual--;
                carregarLogs(paginaAtual);
            }
        });

        document.getElementById('btn-proxima').addEventListener('click', () => {
            paginaAtual++;
            carregarLogs(paginaAtual);
        });

        // Carregar logs inicialmente
        carregarLogs();

        // Função para exibir detalhes (global)
        window.exibirDetalhes = function(logJson, event) {
            event.preventDefault();
            const log = JSON.parse(logJson);
            const modal = document.getElementById('modal-detalhes');
            const conteudo = document.getElementById('modal-conteudo');
            
            conteudo.innerHTML = `
                <div>
                    <p class="text-gray-600 text-sm">Tipo:</p>
                    <p class="font-semibold text-gray-900">${log.tipo}</p>
                </div>
                <div>
                    <p class="text-gray-600 text-sm">Email:</p>
                    <p class="font-semibold text-gray-900">${log.email || '-'}</p>
                </div>
                <div>
                    <p class="text-gray-600 text-sm">Status:</p>
                    <p class="font-semibold text-gray-900">${log.sucesso === true ? '✅ Sucesso' : log.sucesso === false ? '❌ Falha' : '⭕ N/A'}</p>
                </div>
                <div>
                    <p class="text-gray-600 text-sm">Data/Hora:</p>
                    <p class="font-semibold text-gray-900">${log.timestamp ? new Date(log.timestamp.toDate()).toLocaleString('pt-BR') : '-'}</p>
                </div>
                <div>
                    <p class="text-gray-600 text-sm">User Agent:</p>
                    <p class="font-semibold text-gray-900 text-xs break-words">${log.userAgent || '-'}</p>
                </div>
                <div>
                    <p class="text-gray-600 text-sm">URL:</p>
                    <p class="font-semibold text-gray-900 text-xs break-words">${log.url || '-'}</p>
                </div>
                ${log.erroMensagem ? `
                <div>
                    <p class="text-gray-600 text-sm">Erro:</p>
                    <p class="font-semibold text-red-600 text-xs">${log.erroMensagem}</p>
                </div>
                ` : ''}
            `;
            
            modal.classList.remove('hidden');
        };
    </script>

</body>
</html>
