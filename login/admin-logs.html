<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs de Auditoria - Admin Renascer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Header (mantenha o mesmo das outras páginas) -->
    <main class="max-w-7xl mx-auto px-4 py-10">
        <h2 class="text-2xl font-bold mb-6">Logs do Sistema</h2>
        <div class="bg-white rounded-3xl shadow-sm overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-gray-50 border-b">
                    <tr>
                        <th class="p-4 text-xs font-bold uppercase text-gray-500">Data/Hora</th>
                        <th class="p-4 text-xs font-bold uppercase text-gray-500">Usuário</th>
                        <th class="p-4 text-xs font-bold uppercase text-gray-500">Ação</th>
                        <th class="p-4 text-xs font-bold uppercase text-gray-500">Status</th>
                        <th class="p-4 text-xs font-bold uppercase text-gray-500">Detalhes</th>
                    </tr>
                </thead>
                <tbody id="log-body" class="divide-y text-sm"></tbody>
            </table>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        // (Insira seu firebaseConfig aqui)
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Busca logs ordenados pela data (do mais novo para o mais antigo)
        const q = query(collection(db, "logs"), orderBy("dataCriacao", "desc"));
        
        onSnapshot(q, (snapshot) => {
            const body = document.getElementById('log-body');
            body.innerHTML = '';
            snapshot.forEach(doc => {
                const log = doc.data();
                const data = new Date(log.dataCriacao).toLocaleString('pt-BR');
                const corStatus = log.status === 'Sucesso' ? 'text-green-600' : 'text-red-600';
                
                body.innerHTML += `
                    <tr>
                        <td class="p-4 text-gray-500">${data}</td>
                        <td class="p-4 font-bold">${log.usuario}</td>
                        <td class="p-4">${log.acao}</td>
                        <td class="p-4 font-bold ${corStatus}">${log.status}</td>
                        <td class="p-4 text-gray-600 max-w-xs truncate">${log.detalhes}</td>
                    </tr>
                `;
            });
        });
    </script>
</body>
</html>
